name: Scaffold

# What `test.yml` cannot tell you: whether what this CLI writes actually
# installs, typechecks, passes its own suite and bundles for Cloudflare. Every
# spec there is about strings; this job is about a project.
#
# One leg, and it is the train's default branches rather than what is published.
# The train releases in order — core, then plugins, then this package — and a
# merge to `main` here is aimed at syncing with those two mains, so the contracts
# the templates are written against are the ones on those branches. By the time a
# version of this CLI publishes, what a user installs is those tips as they stood
# at that moment. A leg against the registry would hold this package to the
# previous release of a train it is deliberately ahead of, which is a check
# nothing could make pass.
#
# Nothing is deployed — `wrangler deploy --dry-run` compiles and bundles the
# Worker and needs no Cloudflare credentials — so this job has no secrets of any
# kind.
on:
  push:
    branches:
      - main
  pull_request:

# Superseded pull-request runs are cancelled; a run on `main` is left to finish.
concurrency:
  group: scaffold-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scaffold:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - run: npm ci

      # Against the tarball this commit would publish, installed the way `npm
      # create` installs it — without devDependencies. The install the CLI runs
      # for the new project resolves `src/train.ts`'s pins from the registry;
      # the step below replaces the two that this repository moves with it.
      - name: Scaffold an agent
        run: |
          set -euo pipefail
          tarball="$PWD/$(npm pack --silent)"
          cd "$RUNNER_TEMP"
          npm exec --yes --package="$tarball" -- create-dynamicagents \
            agent generic support \
            --name support \
            --description "Answers product questions from the handbook" \
            --browser \
            --yes

      # The train's own default branches, in place of the published core and
      # plugins the scaffold installed. Both carry a `prepare` that builds, and
      # npm runs it for a git dependency, which is what makes `dist/` exist in
      # the install.
      #
      # The Worker types are regenerated after it, so the `check` below reads a
      # `worker-configuration.d.ts` written against what is now installed.
      - name: On the train's main
        working-directory: ${{ runner.temp }}/support
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund \
            github:dynamicagents/core \
            github:dynamicagents/plugins
          npx wrangler types

      # The generated project's own checks, run as its own README tells a dev to
      # run them. `check` begins with `wrangler types --check`, so a scaffold
      # that wrote a `wrangler.jsonc` its own types do not match fails here.
      - name: Its checks
        working-directory: ${{ runner.temp }}/support
        run: npm run check

      - name: Its tests
        working-directory: ${{ runner.temp }}/support
        run: npm test

      # Deployable: the Worker compiles, bundles, and resolves every binding
      # its wrangler config declares. No account, no token, nothing deployed.
      - name: Deployable
        working-directory: ${{ runner.temp }}/support
        run: npx wrangler deploy --dry-run --outdir dist
