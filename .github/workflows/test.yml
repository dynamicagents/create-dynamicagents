name: Test

# A PR runs the suite before it merges, and Release keys off the run Test
# completes on `main`. Why a merge to `main` ships nothing until it carries a
# bump is AGENTS.md's, under Publishing.
on:
  push:
    branches:
      - main
  # Every pull request, not only those into `main`. A stacked PR targets its
  # parent, and a `branches: [main]` filter reports "no checks" on it; when the
  # parent merges, GitHub's retarget fires `edited`, which is not a default
  # event, so the branch could reach `main` having never been tested.
  pull_request:

# Superseded PR runs are cancelled; main is not, because Release keys off the
# run that Test completes there.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          # One source of truth with local dev; `engines` requires >=24.
          node-version-file: .nvmrc

      - run: npm ci

      # `npm test` alone would pass on code that neither typechecks nor formats:
      # vitest transpiles specs without checking them, and the type-aware
      # `no-deprecated` rule only runs here. `check` also builds, which the
      # package gate below reads.
      - run: npm run check

      - run: npm test

      # `prepack` runs this too, but by then the mistake is already on its way
      # to npm. See scripts/verify-package.mjs.
      - run: npm run verify:package

      # What `npm create dynamicagents` does, against the tarball this commit
      # would publish: install it without devDependencies, outside the repo, and
      # run its bin. The only check that sees `files`, `bin` and `dependencies`
      # the way a user does — and all it asserts is that the bin runs, because
      # what the bin *says* is `src/cli.spec.ts`'s, where an assertion can be
      # read in a diff and run on a laptop.
      #
      # Every answer arrives as a flag, because there is no TTY here to ask in.
      # The tarball's name is derived rather than read: `npm pack --silent`
      # shares its stdout with whatever a lifecycle script prints.
      - name: The packed tarball runs
        run: |
          set -euo pipefail
          named=$(node -p 'const p = require("./package.json"); `${p.name}-${p.version}.tgz`')
          npm pack --silent --pack-destination "$RUNNER_TEMP" >/dev/null
          cd "$RUNNER_TEMP"
          npm exec --yes --package="$RUNNER_TEMP/$named" -- create-dynamicagents \
            agent generic demo \
            --name demo --description "A demo agent" --yes --dry-run
