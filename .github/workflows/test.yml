name: Test

# A PR runs the suite before it merges, and Release keys off the run Test
# completes on `main`. Why a merge to `main` ships nothing until it carries a
# bump is AGENTS.md's, under Publishing.
on:
  push:
    branches:
      - main
  # Every pull request, not only those into `main`. A stacked PR targets its
  # parent, and a `branches: [main]` filter reports "no checks" on it; when the
  # parent merges, GitHub's retarget fires `edited`, which is not a default
  # event, so the branch could reach `main` having never been tested.
  pull_request:

# Superseded PR runs are cancelled; main is not, because Release keys off the
# run that Test completes there.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          # One source of truth with local dev; `engines` requires >=24.
          node-version-file: .nvmrc

      - run: npm ci

      # `npm test` alone would pass on code that neither typechecks nor formats:
      # vitest transpiles specs without checking them, and the type-aware
      # `no-deprecated` rule only runs here. `check` also builds, which the
      # package gate below reads.
      - run: npm run check

      - run: npm test

      # `prepack` runs this too, but by then the mistake is already on its way
      # to npm. See scripts/verify-package.mjs.
      - run: npm run verify:package

      # What `npm create dynamicagents` does, against the tarball this commit
      # would publish: install it without devDependencies, outside the repo, and
      # run its bin. The only check that sees `files`, `bin` and `dependencies`
      # the way a user does.
      #
      # Every answer arrives as a flag, because CI has no TTY to ask in — and
      # this is the only place that sees what a run with no terminal says, which
      # every refusal below is about. `scaffold.yml` installs what this writes.
      - name: The packed tarball runs
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          tarball="$PWD/$(npm pack --silent)"
          cd "$RUNNER_TEMP"

          create() {
            npm exec --yes --package="$tarball" -- create-dynamicagents "$@"
          }

          # A run that must refuse: the sentence it has to say, one it must not,
          # and the arguments. In a log there is no prompt around a refusal to
          # make it obvious, so what it says is the whole of what somebody gets.
          refuses() {
            local what="$1" says="$2" never="$3"
            shift 3
            local out status=0
            out=$(create "$@" 2>&1) || status=$?
            if [ "$status" -ne 1 ]; then
              echo "$what: expected exit 1, got $status"; echo "$out"; exit 1
            fi
            if ! grep -qE -- "$says" <<<"$out"; then
              echo "$what: never said \"$says\":"; echo "$out"; exit 1
            fi
            if [ -n "$never" ] && grep -qE -- "$never" <<<"$out"; then
              echo "$what: said \"$never\":"; echo "$out"; exit 1
            fi
          }

          create agent generic demo \
            --name demo --description "A demo agent" --yes --dry-run

          # Both answer whether or not there is a terminal, and `--help` is the
          # one output that has to read the same in a pipe as in one.
          test "$(create --version)" = "$version" || {
            echo "--version did not print $version"; exit 1;
          }
          create --help | grep -q -- "--dry-run" || {
            echo "--help did not list the flags"; exit 1;
          }

          # No answers and no terminal: it must refuse, and name the flags.
          refuses "no answers" "--description" "" agent

          # A mistyped flag is a mistyped flag, terminal or no terminal. It
          # used to be told there was none.
          refuses "a mistyped flag" "is not a flag" "[Nn]o terminal" --hepl

          # A flag whose value will not do is refused where it was given,
          # naming it — not after every other answer, by the plan.
          refuses "a tenant id that will not do" "--name .* will not do" "" \
            agent generic demo --name "My Agent" \
            --description "A demo agent" --yes
